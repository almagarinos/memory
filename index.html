<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>Memory</title>
        <meta name="description" content="Juego familiar de memorama donde emparejar cartas.">

        <!-- Estilos -->
        <link rel="stylesheet" href="assets/css/styles.css">
        
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="assets/icon/favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png">
        <link rel="manifest" href="assets/icon/site.webmanifest">

    </head>

    <body>

        <main id="app">

            <!-- =========== -->
            <!-- MENU SCREEN -->
            <!-- =========== -->
            <section
                id="menu-screen"
                class="screen active-screen"
                aria-labelledby="menu-title"
            >
                <div class="screen-container">

                    <header class="screen-header">
                        <h1 id="menu-title">Memory</h1>
                        <p class="screen-subtitle">
                            Empareja todos los pares de cartas en el menor número de intentos.
                        </p>
                    </header>

                    <div class="difficulty-selector">

                        <h2>Elige la dificultad:</h2>

                        <div class="difficulty-buttons">

                            <button
                                id="easy-button"
                                class="difficulty-button"
                                data-difficulty="easy"
                                type="button"
                            >
                                Fácil (4 pares)
                            </button>

                            <button
                                id="medium-button"
                                class="difficulty-button"
                                data-difficulty="medium"
                                type="button"
                            >
                                Media (12 pares)
                            </button>

                            <button
                                id="hard-button"
                                class="difficulty-button"
                                data-difficulty="hard"
                                type="button"
                            >
                                Difícil (24 pares)
                            </button>

                        </div>

                    </div>

                </div>
            </section>

            <!-- =========== -->
            <!-- GAME SCREEN -->
            <!-- =========== -->
            <section
                id="game-screen"
                class="screen"
                aria-labelledby="game-title"
                hidden
            >
                <div class="screen-container">

                    <header class="game-header">
                        <div class="game-stat">
                            <span class="label">Dificultad</span>
                            <span id="difficulty-value">-</span>
                        </div>

                        <div class="game-stat">
                            <span class="label">Puntuación</span>
                            <span id="score-value">0 %</span>
                        </div>

                        <div class="game-stat">
                            <span class="label">Intentos</span>
                            <span id="attempts-value">0</span>
                        </div>
                    </header>

                    <h2 id="game-title" class="visually-hidden">
                        Tablero de juego
                    </h2>

                    <section id="board" class="game-board" aria-label="Tablero de cartas">
                        <!-- ui.js renderizará aquí las cartas -->
                    </section>

                    <div class="results-actions">
                        <button id="cancel-game-button" type="button">
                            Cancelar partida
                        </button>
                    </div>

                </div>
            </section>

            <!-- ============== -->
            <!-- RESULTS SCREEN -->
            <!-- ============== -->
            <section
                id="results-screen"
                class="screen"
                aria-labelledby="results-title"
                hidden
            >
                <div class="screen-container">

                    <header class="screen-header">
                        <h2 id="results-title">Partida terminada</h2>
                    </header>

                    <div class="results-summary">
                        <p class="results-label">
                            Puntuación final
                        </p>
                        <p id="final-score" class="final-score">
                            0 %
                        </p>
                    </div>

                    <div class="results-actions">
                        <button id="play-again-button" type="button">
                            Jugar de nuevo
                        </button>
                        <button id="back-menu-button" type="button">
                            Volver al menú
                        </button>
                    </div>

                </div>
            </section>

        </main>

        <script src="assets/js/state.js"></script>
        <script src="assets/js/cards.js"></script>
        <script src="assets/js/scoreboard.js"></script>
        <script src="assets/js/ui.js"></script>
        <script src="assets/js/app.js"></script>

    </body>

</html>
